services:
  - type: web
    name: sigg-hub
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Multi-device durable state (required for phone + PC sync across Render sleeps)
      - key: SIGG_STATE_GIST_ID
        sync: false
      - key: SIGG_GITHUB_TOKEN
        sync: false
      # Shared with GitHub Actions secret CRON_SECRET so scheduled jobs can wake this dyno
      - key: CRON_SECRET
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      # Auto-login (recommended) — no more pasting cURL every session
      - key: SIGG_EMAIL
        sync: false
      - key: SIGG_PASSWORD
        sync: false
      # Optional: override portfolio page URL (default tries /main and /portfolio)
      - key: SIGG_PORTFOLIO_URL
        sync: false
      # Optional contest auth fallback (only if auto-login not set)
      - key: SIGG_PORTFOLIO_CURL
        sync: false
      - key: SIGG_RANKING_CURL
        sync: false
