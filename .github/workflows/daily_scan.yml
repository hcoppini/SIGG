name: Daily SIGG Cloud Scanner & Health

# Free Render dynos sleep. This workflow wakes the LIVE hub, health-checks
# auto-login + Gist sync, and runs open/close jobs so phone + PC share state.

on:
  schedule:
    # 07:05 UTC = 08:05 CET — morning health (wake + sync truth check)
    - cron: '5 7 * * 1-5'
    # 08:05 UTC = 09:05 CET — market open scan
    - cron: '5 8 * * 1-5'
    # 15:30 UTC = 16:30 CET — pre-close
    - cron: '30 15 * * 1-5'
    # 15:45 UTC = 16:45 CET — fixing
    - cron: '45 15 * * 1-5'
  workflow_dispatch:
    inputs:
      window:
        description: 'Cron window to run on Render hub'
        required: true
        default: 'health'
        type: choice
        options:
          - ping
          - health
          - open
          - preclose
          - fixing

permissions:
  contents: read

jobs:
  wake-and-run-render-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve cron window
        id: window
        run: |
          if [ -n "${{ github.event.inputs.window }}" ]; then
            echo "name=${{ github.event.inputs.window }}" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(date -u +%H)
            MINUTE=$(date -u +%M)
            if [ "$HOUR" = "07" ]; then
              echo "name=health" >> "$GITHUB_OUTPUT"
            elif [ "$HOUR" = "08" ]; then
              echo "name=open" >> "$GITHUB_OUTPUT"
            elif [ "$MINUTE" -ge 40 ]; then
              echo "name=fixing" >> "$GITHUB_OUTPUT"
            else
              echo "name=preclose" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Require Render secrets
        run: |
          if [ -z "${{ secrets.SIGG_HUB_URL }}" ]; then
            echo "::error::Missing secret SIGG_HUB_URL (example: https://your-service.onrender.com)"
            exit 1
          fi
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::Missing secret CRON_SECRET (must match Render env CRON_SECRET)"
            exit 1
          fi

      - name: Wake Render dyno (retry)
        env:
          HUB_URL: ${{ secrets.SIGG_HUB_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          BASE="${HUB_URL%/}"
          echo "Waking $BASE ..."
          for i in 1 2 3 4 5 6 7 8; do
            CODE=$(curl -s -o /tmp/sigg_ping.json -w "%{http_code}" \
              -H "X-Cron-Secret: $CRON_SECRET" \
              "$BASE/api/cron/ping" || true)
            echo "Attempt $i -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/sigg_ping.json
              exit 0
            fi
            sleep 20
          done
          echo "::error::Render hub did not wake / auth failed."
          cat /tmp/sigg_ping.json || true
          exit 1

      - name: Run scheduled window on Render
        env:
          HUB_URL: ${{ secrets.SIGG_HUB_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WINDOW: ${{ steps.window.outputs.name }}
        run: |
          set -e
          BASE="${HUB_URL%/}"
          echo "Triggering /api/cron/$WINDOW"
          CODE=$(curl -s -o /tmp/sigg_cron.json -w "%{http_code}" \
            -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "{}" \
            --max-time 300 \
            "$BASE/api/cron/$WINDOW")
          echo "HTTP $CODE"
          cat /tmp/sigg_cron.json
          echo ""
          if [ "$WINDOW" = "health" ]; then
            # Red X on Actions = morning alarm (no Discord). Body must say healthy:true.
            python3 -c '
          import json,sys
          d=json.load(open("/tmp/sigg_cron.json"))
          print("healthy=", d.get("healthy"))
          print("checks=", json.dumps(d.get("checks") or {}, indent=2))
          if not d.get("healthy"):
              print("::error::Hub health FAILED — fix auto-login / Gist / contest sync before the open")
              sys.exit(1)
          '
          fi
          test "$CODE" = "200"
